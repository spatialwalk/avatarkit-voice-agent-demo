name: AvatarDemo
options:
  bundleIdPrefix: ai.spatialreal.demo
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

targets:
  AvatarDemo:
    type: application
    platform: iOS
    sources:
      - AvatarDemo
    settings:
      base:
        INFOPLIST_FILE: AvatarDemo/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: ai.spatialreal.demo.AvatarDemo
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: ["-lz", "-lc++"]
      configs:
        debug:
          FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]: "$(PROJECT_DIR)/AvatarKit.xcframework/ios-arm64"
          FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]: "$(PROJECT_DIR)/AvatarKit.xcframework/ios-arm64-simulator"
        release:
          FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]: "$(PROJECT_DIR)/AvatarKit.xcframework/ios-arm64"
          FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]: "$(PROJECT_DIR)/AvatarKit.xcframework/ios-arm64-simulator"
    dependencies:
      - framework: AvatarKit.xcframework
        embed: false
    preBuildScripts:
      - name: Download AvatarKit
        script: |
          DOWNLOAD_URL="https://character-resource-bj-1373098193.cos.ap-beijing.myqcloud.com/xcframework/AvatarKit_202512301414.zip"
          EXPECTED_CHECKSUM="8c0d213c89a2c31a628b834d34586acbdd9e9206b9e99ef5247ac2aa6bddf0d7"

          set -e

          FRAMEWORK_PATH="${PROJECT_DIR}/AvatarKit.xcframework"
          ZIP_PATH="${PROJECT_DIR}/AvatarKit.xcframework.zip"
          CHECKSUM_FILE="${PROJECT_DIR}/.avatarkit_checksum"

          NEED_DOWNLOAD=false

          if [ ! -d "$FRAMEWORK_PATH" ]; then
              NEED_DOWNLOAD=true
          elif [ ! -f "$CHECKSUM_FILE" ]; then
              NEED_DOWNLOAD=true
          elif [ "$(cat "$CHECKSUM_FILE")" != "$EXPECTED_CHECKSUM" ]; then
              NEED_DOWNLOAD=true
          else
              echo "AvatarKit.xcframework is up to date."
              exit 0
          fi

          if [ "$NEED_DOWNLOAD" = true ]; then
              echo "Downloading AvatarKit.xcframework..."
              if ! curl -L -f -o "$ZIP_PATH" "$DOWNLOAD_URL"; then
                  echo "Error: Failed to download"
                  exit 1
              fi
              ACTUAL_CHECKSUM=$(shasum -a 256 "$ZIP_PATH" | awk '{print $1}')
              if [ "$ACTUAL_CHECKSUM" != "$EXPECTED_CHECKSUM" ]; then
                  echo "Checksum mismatch!"
                  rm -f "$ZIP_PATH"
                  exit 1
              fi
              [ -d "$FRAMEWORK_PATH" ] && rm -rf "$FRAMEWORK_PATH"
              unzip -q -o "$ZIP_PATH" -d "$PROJECT_DIR"
              rm -f "$ZIP_PATH"
              echo "$EXPECTED_CHECKSUM" > "$CHECKSUM_FILE"
              echo "AvatarKit.xcframework installed."
          fi
    postBuildScripts:
      - name: Copy AvatarKit Resources
        script: |
          XCFRAMEWORK_PATH="${PROJECT_DIR}/AvatarKit.xcframework"
          if [ "${PLATFORM_NAME}" = "iphonesimulator" ]; then
            ARCH_DIR="ios-arm64-simulator"
          else
            ARCH_DIR="ios-arm64"
          fi
          RESOURCE_BUNDLE="${XCFRAMEWORK_PATH}/${ARCH_DIR}/AvatarKit.framework/AvatarKitResources.bundle"
          if [ -d "${RESOURCE_BUNDLE}" ]; then
            cp -R "${RESOURCE_BUNDLE}" "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/"
          else
            echo "Warning: AvatarKitResources.bundle not found at ${RESOURCE_BUNDLE}"
          fi
